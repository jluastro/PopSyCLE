[metadata]
name = popsycle
author = Casey Lam and Jessica Lu
author_email = jlu.astro@berkeley.edu
license = BSD 3-Clause
license_file = licenses/LICENSE.rst
url = https://github.com/MovingUniverseLab/PopSyCLE
description = Population Synthesis for Compact-object Lensing Events
long_description = file: README.rst
long_description_content_type = text/x-rst
edit_on_github = False
github_project = MovingUniverseLab/PopSyCLE

[options]
zip_safe = False
packages = find:
include_package_data = True
python_requires = >=3.11,<3.12
install_requires =
    numpy>=1.24.3
    matplotlib>=3.7.1
    astropy>=5.3
    h5py>=3.8.0
    scipy>=1.10.1
    pyyaml>=6.0
    pandas>=1.5.2
    pysynphot>=2.0.0
    synphot>=1.7.0
    stsynphot>=1.5.1
    scikit-learn
    celerite
    jplephem
    ephem
    bagle>=1.0.5


[options.extras_require]
test =
    pytest>=7.2.0
    pytest-astropy
docs =
    numpydoc>=1.5
    sphinx_rtd_theme
    sphinx-astropy
dev =
    build
    wheel
    twine

[options.entry_points]
console_scripts =
    popsycle = popsycle.run:main

[options.package_data]
popsycle =
    data/*
    tests/data_correct/*
    tests/data_test/*

[options.packages.find]
namespaces = False
exclude =
    popsycle.data
    popsycle.tests.data_correct
    popsycle.tests.data_test

[tool:pytest]
testpaths = "popsycle" "docs"
astropy_header = true
doctest_plus = enabled
text_file_format = rst
#addopts = --doctest-rst

[coverage:run]
omit =
    popsycle/_astropy_init*
    popsycle/conftest.py
    popsycle/*setup_package*
    popsycle/tests/*
    popsycle/*/tests/*
    popsycle/extern/*
    popsycle/version*
    */popsycle/_astropy_init*
    */popsycle/conftest.py
    */popsycle/*setup_package*
    */popsycle/tests/*
    */popsycle/*/tests/*
    */popsycle/extern/*
    */popsycle/version*

[coverage:report]
exclude_lines =
    # Have to re-enable the standard pragma
    pragma: no cover
    # Don't complain about packages we have installed
    except ImportError
    # Don't complain if tests don't hit assertions
    raise AssertionError
    raise NotImplementedError
    # Don't complain about script hooks
    def main\(.*\):
    # Ignore branches that don't pertain to this version of Python
    pragma: py{ignore_python_version}
    # Don't complain about IPython completion helper
    def _ipython_key_completions_
